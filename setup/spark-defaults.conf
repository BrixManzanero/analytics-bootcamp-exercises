# ============================================================
# Apache Iceberg
# ============================================================

spark.sql.extensions                               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions


# ============================================================
# Iceberg REST Catalog
# ============================================================

spark.sql.catalog.lakehouse                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                   rest
spark.sql.catalog.lakehouse.uri                    http://asb-iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse              s3://warehouse/


# ============================================================
# Iceberg S3FileIO / SeaweedFS
# Used when reading and writing Iceberg tables
# ============================================================

spark.sql.catalog.lakehouse.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint            http://asb-seaweedfs:8333
spark.sql.catalog.lakehouse.s3.path-style-access   true
spark.sql.catalog.lakehouse.client.region          us-east-1


# ============================================================
# Hadoop S3A / SeaweedFS
# Used when directly reading raw s3a:// files
# ============================================================

spark.hadoop.fs.s3a.impl                           org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                       http://asb-seaweedfs:8333
spark.hadoop.fs.s3a.endpoint.region                us-east-1
spark.hadoop.fs.s3a.path.style.access              true
spark.hadoop.fs.s3a.connection.ssl.enabled         false
spark.hadoop.fs.s3a.change.detection.mode          none

# Read credentials from AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY in Compose.
spark.hadoop.fs.s3a.aws.credentials.provider       com.amazonaws.auth.EnvironmentVariableCredentialsProvider


# ============================================================
# Spark dependencies
# Version must match Spark's Hadoop version
# ============================================================

spark.jars.packages                                org.apache.hadoop:hadoop-aws:3.3.4
spark.jars.ivy                                     /opt/spark/ivy-cache


# ============================================================
# Spark SQL
# ============================================================

spark.sql.defaultCatalog                           lakehouse
spark.sql.session.timeZone                         UTC
spark.sql.ansi.enabled                             true